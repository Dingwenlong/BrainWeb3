name: build-images

# Pre-build the deploy images in the cloud and push them to GHCR, so a small
# (e.g. 2 GB) server can just `docker compose pull` instead of compiling locally.
on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "apps/frontend/**"
      - "services/eeg-service/**"
      - "deploy/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./apps/backend
            dockerfile: ./apps/backend/Dockerfile
          - name: eeg-service
            context: ./services/eeg-service
            dockerfile: ./services/eeg-service/Dockerfile
          - name: web
            context: .
            dockerfile: ./deploy/web.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Compute image base (lowercase owner/repo)
        id: img
        run: echo "base=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.img.outputs.base }}-${{ matrix.name }}:latest
            ${{ steps.img.outputs.base }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
